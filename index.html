<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - by Adib dan Nabil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>


  </head>
  <body>
    <!-- Header Section -->
    <h1>Gallery</h1>
    <h2>by Adib dan Nabil</h2>
    <button id="plusProject">+</button>

    <hr />

    <!-- Add Project Dialog Modal -->
    <dialog id="projectDialog">
      <form id="projectForm" method="dialog">
        <h3>Add New Java Project</h3>

        <p>
          <label for="projectName">Project Name:</label><br />
          <input
            type="text"
            id="projectName"
            placeholder="e.g. Main.java"
            required
          />
        </p>

        <p>
          <label for="projectDesc">Description:</label><br />
          <textarea
            id="projectDesc"
            rows="3"
            cols="40"
            placeholder="Enter project description"
            required
          ></textarea>
        </p>

        <p>
          <label for="projectCode">Java Code:</label><br />
          <textarea
            id="projectCode"
            rows="10"
            cols="50"
            placeholder="Paste Java code here..."
            required
          ></textarea>
        </p>

        <div>
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" id="saveBtn">Save Project</button>
        </div>
      </form>
    </dialog>

    <!-- View Code Dialog Modal -->
    <dialog id="viewDialog">
      <h3 id="viewTitle"></h3>
      <p id="viewDesc"></p>
      <pre><code id="viewCode"></code></pre>
      <div>
        <button type="button" id="copyBtn">Copy Code</button>
        <button type="button" id="closeViewBtn">Close</button>
      </div>
    </dialog>

    <!-- Project Gallery Container -->
    <h2>Saved Projects</h2>
    <div id="projectContainer"></div>

    <script>
      // Initial sample data if local storage is empty
      const SAMPLE_PROJECTS = [
        {
          id: "sample-1",
          name: "HelloWorld.java",
          description:
            "A standard starter program that outputs Hello, World! to the console.",
          code: 'public class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}',
        },
        {
          id: "sample-2",
          name: "SimpleCalculator.java",
          description: "A simple addition utility class written in Java.",
          code: 'public class SimpleCalculator {\n    public static int add(int a, int b) {\n        return a + b;\n    }\n\n    public static void main(String[] args) {\n        int result = add(5, 10);\n        System.out.println("Sum: " + result);\n    }\n}',
        },
      ];

      // Helper functions for LocalStorage management
      function getProjects() {
        const data = localStorage.getItem("java_gallery_projects");
        if (!data) {
          localStorage.setItem(
            "java_gallery_projects",
            JSON.stringify(SAMPLE_PROJECTS),
          );
          return SAMPLE_PROJECTS;
        }
        try {
          return JSON.parse(data);
        } catch (e) {
          return SAMPLE_PROJECTS;
        }
      }

      function saveProjects(projects) {
        localStorage.setItem("java_gallery_projects", JSON.stringify(projects));
      }

      // Render projects list onto page
      function renderProjects() {
        const container = document.getElementById("projectContainer");
        container.innerHTML = "";
        const projects = getProjects();

        if (projects.length === 0) {
          container.innerHTML = "<p>No projects saved yet.</p>";
          return;
        }

        projects.forEach((project) => {
          const fieldset = document.createElement("fieldset");

          const legend = document.createElement("legend");
          legend.textContent = project.name;
          fieldset.appendChild(legend);

          const h3 = document.createElement("h3");
          h3.textContent = project.name;
          fieldset.appendChild(h3);

          const desc = document.createElement("p");
          desc.textContent = project.description;
          fieldset.appendChild(desc);

          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = project.code;
          pre.appendChild(code);
          fieldset.appendChild(pre);

          const viewBtn = document.createElement("button");
          viewBtn.textContent = "View";
          viewBtn.onclick = () => openViewDialog(project);
          fieldset.appendChild(viewBtn);

          const copyBtn = document.createElement("button");
          copyBtn.textContent = "Copy";
          copyBtn.onclick = (e) => copyToClipboard(project.code, e.target);
          fieldset.appendChild(copyBtn);

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = () => deleteProject(project.id);
          fieldset.appendChild(deleteBtn);

          container.appendChild(fieldset);
        });
      }

      // Safe Clipboard Copy Function
      function copyToClipboard(text, targetButton) {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);

        if (targetButton) {
          const originalText = targetButton.textContent;
          targetButton.textContent = "Copied!";
          setTimeout(() => {
            targetButton.textContent = originalText;
          }, 1500);
        }
      }

      // Open Code View Modal
      function openViewDialog(project) {
        const dialog = document.getElementById("viewDialog");
        document.getElementById("viewTitle").textContent = project.name;
        document.getElementById("viewDesc").textContent = project.description;
        document.getElementById("viewCode").textContent = project.code;

        const copyBtn = document.getElementById("copyBtn");
        copyBtn.onclick = (e) => copyToClipboard(project.code, e.target);

        dialog.showModal();
      }

      // Delete project entry
      function deleteProject(id) {
        let projects = getProjects();
        projects = projects.filter((p) => p.id !== id);
        saveProjects(projects);
        renderProjects();
      }

      // Event Listener setup
      const projectDialog = document.getElementById("projectDialog");
      const plusProjectBtn = document.getElementById("plusProject");
      const cancelBtn = document.getElementById("cancelBtn");
      const projectForm = document.getElementById("projectForm");
      const closeViewBtn = document.getElementById("closeViewBtn");
      const viewDialog = document.getElementById("viewDialog");

      plusProjectBtn.addEventListener("click", () => {
        document.getElementById("projectName").value = "";
        document.getElementById("projectDesc").value = "";
        document.getElementById("projectCode").value = "";
        projectDialog.showModal();
      });

      cancelBtn.addEventListener("click", () => {
        projectDialog.close();
      });

      closeViewBtn.addEventListener("click", () => {
        viewDialog.close();
      });

      projectForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("projectName").value.trim();
        const description = document.getElementById("projectDesc").value.trim();
        const code = document.getElementById("projectCode").value;

        if (!name || !description || !code) return;

        const newProject = {
          id: "proj-" + Date.now(),
          name: name,
          description: description,
          code: code,
        };

        const projects = getProjects();
        projects.unshift(newProject);
        saveProjects(projects);
        renderProjects();
        projectDialog.close();
      });

      // Initial load
      renderProjects();
    </script>
  </body>
</html>
